<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Europe · 欧洲之旅 · September 2026</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Inter:wght@400;500;600&family=Noto+Serif+SC:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    --paper: #FAF8F3;
    --ink: #1C2431;
    --wine: #6E2A3A;
    --wine-soft: #F3E7EA;
    --graphite: #6F7681;
    --hairline: #E3DED4;
    --booked: #2F5F4F;
    --booked-soft: #E6EFEB;
    --pending: #8A6A1F;
    --pending-soft: #F4EDDD;
    --measure: 640px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 15px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  body.zh { font-family: 'Inter', 'Noto Serif SC', -apple-system, 'PingFang SC', 'Hiragino Sans GB', sans-serif; }
  .serif { font-family: 'Cormorant Garamond', Georgia, serif; }
  body.zh .serif { font-family: 'Noto Serif SC', 'Cormorant Garamond', Georgia, serif; }

  .page { max-width: var(--measure); margin: 0 auto; padding: 0 22px 80px; }

  /* ---------- Top bar ---------- */
  .topbar {
    position: sticky; top: 0; z-index: 10;
    background: color-mix(in srgb, var(--paper) 92%, transparent);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 0 10px;
    border-bottom: 1px solid var(--hairline);
  }
  .topbar .title { font-size: 14px; color: var(--graphite); }
  .lang {
    display: inline-flex; border: 1px solid var(--hairline); border-radius: 999px; overflow: hidden;
  }
  .lang button {
    background: transparent; border: 0; padding: 6px 12px;
    font: inherit; font-size: 13px; color: var(--graphite); cursor: pointer;
  }
  .lang button.on { background: var(--ink); color: var(--paper); }
  .lang button:focus-visible { outline: 2px solid var(--wine); outline-offset: -2px; }

  /* ---------- Hero ---------- */
  .hero { padding: 40px 0 28px; }
  .hero h1 { font-weight: 300; font-size: clamp(56px, 13vw, 92px); line-height: 0.95; letter-spacing: -0.01em; }
  body.zh .hero h1 { font-weight: 300; font-size: clamp(44px, 11vw, 72px); letter-spacing: 0.02em; }
  .hero .sub { margin-top: 14px; font-style: italic; font-size: 21px; color: var(--graphite); }
  body.zh .hero .sub { font-style: normal; font-size: 17px; }
  .hero .names { margin-top: 4px; font-size: 13px; color: var(--graphite); }

  /* ---------- Route ---------- */
  .route {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 0;
    margin: 32px 0 30px; position: relative;
  }
  .route::before {
    content: ""; position: absolute; left: 12.5%; right: 12.5%; top: 6px; height: 1px; background: var(--hairline);
  }
  .route button {
    background: transparent; border: 0; padding: 0; cursor: pointer; font: inherit; color: var(--ink);
    display: flex; flex-direction: column; align-items: center; gap: 10px;
  }
  .route .dot { width: 11px; height: 11px; border-radius: 50%; border: 1.5px solid var(--ink); background: var(--paper); position: relative; z-index: 1; }
  .route .city { font-size: 20px; line-height: 1; }
  body.zh .route .city { font-size: 17px; }
  .route .when { font-size: 11px; color: var(--graphite); }
  .route button.on .dot { background: var(--wine); border-color: var(--wine); }
  .route button:focus-visible { outline: 2px solid var(--wine); outline-offset: 4px; border-radius: 4px; }

  /* ---------- Date strip ---------- */
  .strip {
    display: flex; gap: 8px; overflow-x: auto; padding: 4px 2px 12px;
    scrollbar-width: none; -ms-overflow-style: none;
    scroll-snap-type: x proximity;
  }
  .strip::-webkit-scrollbar { display: none; }
  .strip button {
    flex: 0 0 auto; min-width: 58px; padding: 10px 8px;
    background: transparent; border: 1px solid var(--hairline); border-radius: 12px;
    font: inherit; color: var(--ink); cursor: pointer; text-align: center; scroll-snap-align: center;
  }
  .strip button .dow { display: block; font-size: 11px; color: var(--graphite); }
  .strip button .num { display: block; font-size: 20px; line-height: 1.15; margin-top: 2px; }
  .strip button.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .strip button.on .dow { color: color-mix(in srgb, var(--paper) 70%, transparent); }
  .strip button.today:not(.on) { border-color: var(--wine); }
  .strip button:focus-visible { outline: 2px solid var(--wine); outline-offset: 2px; }

  /* ---------- Day ---------- */
  .day-head { margin: 22px 0 6px; }
  .day-head h2 { font-weight: 400; font-size: 34px; line-height: 1.05; }
  body.zh .day-head h2 { font-size: 28px; }
  .day-head .where { margin-top: 6px; font-size: 13.5px; color: var(--graphite); }
  .day-head .where a { color: inherit; text-decoration: none; border-bottom: 1px solid var(--hairline); }
  .day-head .where a:hover { border-bottom-color: var(--graphite); }

  .events { list-style: none; margin-top: 16px; border-top: 1px solid var(--hairline); }
  .ev {
    display: grid; grid-template-columns: 62px 1fr; gap: 14px;
    padding: 14px 0; border-bottom: 1px solid var(--hairline); align-items: start;
  }
  .ev .time { font-size: 13px; color: var(--graphite); line-height: 1.5; padding-top: 2px; }
  .ev .time .end { display: block; font-size: 11.5px; color: color-mix(in srgb, var(--graphite) 70%, transparent); }
  .ev .name { font-size: 16px; font-weight: 500; line-height: 1.35; }
  .ev.travel .name { color: var(--wine); }
  .ev.ticket {
    background: linear-gradient(90deg, color-mix(in srgb, var(--pending) 8%, transparent), transparent 40%);
    border-left: 2px solid var(--pending);
    padding-left: 12px;
    margin-left: -14px;
  }
  .ev .note { margin-top: 4px; font-size: 14px; color: #3E4652; line-height: 1.55; }
  .ev .meta { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .maplink {
    font-size: 12.5px; color: var(--ink); text-decoration: none;
    border-bottom: 1px solid var(--hairline); padding-bottom: 1px;
  }
  .maplink:hover { border-bottom-color: var(--ink); }
  .maplink:focus-visible { outline: 2px solid var(--wine); outline-offset: 2px; }

  .hop {
    display: grid; grid-template-columns: 62px 1fr; gap: 14px;
    padding: 6px 0; font-size: 12px; color: var(--graphite); font-style: italic;
    border-bottom: 1px solid var(--hairline);
  }
  .hop::before { content: ""; display: block; justify-self: center; width: 1px; height: 18px; background: var(--hairline); }
  body.zh .hop { font-style: normal; }

  .nav { display: flex; justify-content: space-between; margin-top: 26px; }
  .nav button {
    background: transparent; border: 1px solid var(--hairline); border-radius: 999px;
    padding: 9px 16px; font: inherit; font-size: 13.5px; color: var(--ink); cursor: pointer;
  }
  .nav button:disabled { opacity: .35; cursor: default; }
  .nav button:focus-visible { outline: 2px solid var(--wine); outline-offset: 2px; }

  footer { margin-top: 56px; padding-top: 18px; border-top: 1px solid var(--hairline); font-size: 12.5px; color: var(--graphite); line-height: 1.8; }
  footer span { display: block; }

  @media (prefers-reduced-motion: no-preference) {
    .day-view { animation: fade .28s ease-out both; }
    @keyframes fade { from { opacity: 0; transform: translateY(4px);} to { opacity: 1; transform: none; } }
  }

  /* ---------- Note pills / buttons ---------- */
  .ev .meta { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .actionbtn {
    font-size: 12.5px; color: var(--ink); background: transparent;
    border: 1px solid var(--hairline); border-radius: 999px; padding: 4px 12px;
    cursor: pointer; font-family: inherit; text-decoration: none; line-height: 1.5;
  }
  .actionbtn:hover { border-color: var(--ink); }
  .actionbtn:focus-visible { outline: 2px solid var(--wine); outline-offset: 2px; }
  .actionbtn.tip { color: var(--wine); border-color: color-mix(in srgb, var(--wine) 35%, var(--hairline)); }

  /* ---------- Bottom-sheet modal ---------- */
  .sheet-backdrop {
    position: fixed; inset: 0; background: rgba(28,36,49,0.4);
    opacity: 0; pointer-events: none; transition: opacity .2s ease; z-index: 50;
  }
  .sheet-backdrop.open { opacity: 1; pointer-events: auto; }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 51;
    background: var(--paper); border-radius: 18px 18px 0 0;
    max-width: var(--measure); margin: 0 auto;
    padding: 20px 24px calc(28px + env(safe-area-inset-bottom));
    max-height: 75vh; overflow-y: auto;
    transform: translateY(100%); transition: transform .28s cubic-bezier(.32,.72,0,1);
    box-shadow: 0 -8px 30px rgba(28,36,49,0.15);
  }
  .sheet.open { transform: translateY(0); }
  .sheet .handle {
    width: 36px; height: 4px; border-radius: 999px; background: var(--hairline);
    margin: 0 auto 16px;
  }
  .sheet h3 { font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 500; font-size: 24px; margin-bottom: 12px; }
  body.zh .sheet h3 { font-family: 'Noto Serif SC', serif; font-size: 20px; }
  .sheet .body { font-size: 14.5px; line-height: 1.75; color: #2E3641; white-space: pre-line; }
  .sheet .close {
    position: absolute; top: 16px; right: 20px; background: transparent; border: 0;
    font-size: 20px; color: var(--graphite); cursor: pointer; line-height: 1; padding: 4px;
  }
</style>
</head>
<body>
<div class="page">

  <div class="topbar">
    <span class="title" data-en="Trip companion" data-zh="旅行手册"></span>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-lang="en">EN</button>
      <button type="button" data-lang="zh">中文</button>
    </div>
  </div>

  <nav class="route" id="route" aria-label="Cities"></nav>

  <div class="strip" id="strip" role="tablist" aria-label="Days"></div>

  <div class="nav">

</div>

</div>

   { tr_en:'Car, 12 min', tr_zh:'打车 12 分钟', t:'16:00', e:'17:15', en:'Champs-Élysées and the Arc', zh:'香榭丽舍与凯旋门', ne:'Paris\'s grand shopping avenue, running dead straight to the Arc de Triomphe. The upper stretch holds flagship stores — Louis Vuitton\'s largest shop in the world, Dior, Cartier, Sephora — and Ladurée for macarons.',
     nz:'巴黎的购物大道，笔直通向凯旋门。上半段是旗舰店：全球最大的 Louis Vuitton、Dior、Cartier、Sephora，还有卖马卡龙的 Ladurée。',
     tip_en:'Start at the Rond-Point and walk up the avenue to the arch — 1.2 km, shops the whole way. The stretch below the Rond-Point, down to Place de la Concorde, is gardens rather than shops.\n\nUse the underpass to reach the arch — never cross the roundabout at street level.',
     tip_zh:'从 Rond-Point 起步，沿大道往上走到凯旋门——1.2 公里，一路都是店。Rond-Point 以下到协和广场那一段是公园绿地，没有商店。\n\n走地下通道去凯旋门——千万不要在地面直接穿过环岛。',
     q:'Rond-Point des Champs-Élysées, 75008 Paris' },
   { tr_en:'Car, 15 min', tr_zh:'打车 15 分钟', t:'17:30', e:'19:00', en:'Saint-Germain', zh:'圣日耳曼区', ne:'The Left Bank café quarter where Sartre, Beauvoir and Hemingway wrote — narrow streets of art galleries and antique dealers around Rue Bonaparte and Rue de Seine.', nz:'左岸的咖啡馆街区，萨特、波伏娃和海明威曾在此写作——Bonaparte 街和 de Seine 街一带是画廊和古董商聚集的窄巷。', q:'Saint-Germain-des-Prés, Paris' },
   { t:'19:30', e:'21:00', en:'Dinner', zh:'晚餐', ne:'', nz:'' },
 ]},

   { ticket:true, t:'06:30', e:'07:00', en:'Uber to Gare de Lyon', zh:'Uber 前往里昂车站', ne:'Pre-booked car.', nz:'已预约车辆。' },
   { ticket:true, t:'07:22', e:'10:26', travel:true, en:'Paris → Basel', zh:'巴黎 → 巴塞尔', q:'Gare de Lyon, Paris' },
   { ticket:true, tr_en:'Walk across the station, 10 min', tr_zh:'站内步行 10 分钟', t:'11:30', e:'14:10', travel:true, en:'Basel → Grindelwald', zh:'巴塞尔 → 格林德瓦', tip_en:'The change at Basel SBB is straightforward. Interlaken Ost is the one that needs attention.\n\nThe regional train from Interlaken Ost splits in half at Zweilütschinen: one half uncouples for Lauterbrunnen, the other for Grindelwald.\n\nBefore boarding, check that the destination screen on the side of the carriage explicitly says Grindelwald. The platform board also shows which sector (Sector A or B) is the Grindelwald half.\n\nSaver Day Pass — travel is not tied to a specific train, so missing a connection just means taking the next one.', tip_zh:'巴塞尔 SBB 的换乘很简单，需要格外注意的是 Interlaken Ost。\n\n从 Interlaken Ost 出发的区域列车会在 Zweilütschinen 分成两半：一半开往劳特布龙嫩（Lauterbrunnen），另一半开往格林德瓦（Grindelwald）。\n\n上车前先确认车厢侧面的目的地显示屏写着 Grindelwald。站台指示牌也会标明哪个区段（Sector A 或 B）是往格林德瓦的那一半。\n\n已购一日通票（Saver Day Pass），不绑定固定车次，错过接驳搭下一班即可。', q:'Grindelwald Bahnhof' },
   { tr_en:'Walk 5 min to hotel', tr_zh:'步行 5 分钟到酒店', t:'Evening', e:'', en:'Dorfstrasse', zh:'Dorfstrasse 主街', ne:'The village main street — shops, restaurants and bars. The hotel is on it at number 53, with the north face of the Eiger filling the view.', nz:'小镇主街——商店、餐厅和酒吧。酒店就在街上 53 号，正对艾格峰北壁。', q:'Dorfstrasse, Grindelwald' },
 ]},
 { d:'2026-09-11', back_en:'Walk 5 min back to hotel.', back_zh:'步行 5 分钟回酒店。', city:'grind', en:'Up the mountain', zh:'上山', ev:[
   { t:'07:30', e:'08:00', notime:true, en:'Breakfast', zh:'早餐', ne:'At the hotel.', nz:'酒店内。' },
   { tr_en:'Walk 10 min down Dorfstrasse to the valley station', tr_zh:'沿 Dorfstrasse 步行 10 分钟到山谷站', t:'08:30', e:'12:15', en:'Grindelwald First', zh:'菲斯特 First', ne:'A gondola up to a green alpine shelf at 2,168 metres, facing the Eiger, Mönch and Jungfrau. The Cliff Walk at the top, then the four rides all the way back down to the village.', nz:'缆车升到 2168 米的绿色高山台地，正对艾格峰、僧侣峰和少女峰。先在山顶走悬崖步道，再靠四项设施一路玩回镇上。', tip_en:'The order matters — each ride starts where the last one ends, so you never ride back up.\n\nGondola up, 25 minutes to First.\nCliff Walk — a steel walkway and suspension bridge at the top station.\nFirst Flyer — 800 m cable, First down to Schreckfeld at up to 84 km/h.\nFirst Glider — towed backwards from Schreckfeld up to First, then flies forward back down, so it starts and finishes at Schreckfeld.\nMountain Cart — 3 km of gravel, Schreckfeld down to Bort, about 380 m of descent.\nTrottibike — 5 km on a scooter, Bort down to Grindelwald, 566 m of descent, finishing in the village.\n\nAll four rides need an Adventure Package on top of the gondola ticket. Buy it at the valley station before going up.', tip_zh:'顺序很重要——每一项的起点就是上一项的终点，全程不用再坐缆车上山。\n\n缆车上山，25 分钟到 First。\n悬崖步道 Cliff Walk——山顶站旁的钢制栈道和吊桥。\nFirst Flyer——800 米钢索，从 First 滑到 Schreckfeld，时速最高 84 公里。\nFirst Glider——从 Schreckfeld 倒着拖回 First，再向前俯冲下来，起点终点都在 Schreckfeld。\n山地卡丁车——3 公里碎石道，从 Schreckfeld 到 Bort，落差约 380 米。\nTrottibike 滑板车——5 公里，从 Bort 回格林德瓦，落差 566 米，终点就在镇上。\n\n四项活动都需要在缆车票之外另购 Adventure Package（探险套票），上山前在山谷站买好。', q:'Firstbahn Talstation, Dorfstrasse 187, 3818 Grindelwald' },
   { tr_en:'Walk 10 min', tr_zh:'步行 10 分钟', t:'14:00', e:'17:30', en:'Easy afternoon', zh:'轻松的下午', ne:'Pfingstegg has a summer toboggan run and a fly-line through the treetops. The glacier gorge is a walkway through a narrow ravine with meltwater roaring beneath your feet.', nz:'Pfingstegg 有夏季滑道和穿越树顶的滑索。冰川峡谷是一条穿过狭窄峡谷的栈道，冰川融水在脚下轰鸣。', q:'Dorfstrasse, Grindelwald' },
 ]},

 { d:'2026-09-15', back_en:'Walk 13 min back to hotel.', back_zh:'步行 13 分钟回酒店。', city:'florence', en:'David and the dome', zh:'大卫与穹顶', ev:[

     nz:'一座围绕单一作品建立的小型美术馆：米开朗基罗 26 岁时用一块被另外两位雕塑家放弃的大理石雕出的大卫像。通往他的走廊两侧陈列着未完成的囚徒像。',
     tip_en:'Don\'t forget to bring the David perler beads!\n\nTimed 09:00 — arrive by 08:45.',
     tip_zh:'别忘了带大卫拼豆！\n\n09:00 定时入场——08:45 前到。',
     q:'Galleria dell\'Accademia, Firenze' },
   { tr_en:'Walk 12 min', tr_zh:'步行 12 分钟', t:'10:45', e:'12:00', en:'Lunch at Sant\'Ambrogio market', zh:'午餐 · 圣安布罗焦市场', ne:'A covered hall of butchers, cheesemongers and delis. Il Trippaio\'s cart out front sells lampredotto — Florence\'s tripe sandwich, simmered and served on a crusty roll — and Trattoria da Rocco inside does cheap hot pasta, ribollita and roast meats at shared tables.', nz:'一座有肉铺、奶酪店和熟食店的室内市场。门口 Il Trippaio 的小车卖 lampredotto——炖牛肚夹在脆皮面包里——市场内的 Trattoria da Rocco 则供应便宜的热意面、蔬菜浓汤 ribollita 和烤肉，大家共用长桌用餐。', q:'Mercato di Sant\'Ambrogio, Firenze' },
   { ticket:true, tr_en:'Walk 12 min', tr_zh:'步行 12 分钟', t:'12:45', e:'15:00', en:'Duomo', zh:'圣母百花大教堂', ne:'Brunelleschi\'s dome, completed in 1436 without scaffolding — still the largest brick dome ever built. The climb runs between its two shells, past Vasari\'s Last Judgment fresco, to the lantern above the whole city.',
     nz:'布鲁内莱斯基的穹顶，1436 年在没有脚手架的情况下建成——至今仍是世界最大的砖砌穹顶。攀登路线穿过穹顶的双层壳，经过瓦萨里的《最后的审判》壁画，到达俯瞰全城的顶塔。',
     tip_en:'Dome slot: 12:45, fixed — be at the dome entrance by 12:40.\n\nCathedral, Baptistery and the Duomo Museum are NOT time-fixed.',
     tip_zh:'穹顶时段：12:45，固定——12:40 前到穹顶入口。\n\n教堂、洗礼堂和大教堂博物馆不限时段。',
     q:'Duomo di Firenze' },
   { tr_en:'Walk 5 min', tr_zh:'步行 5 分钟', t:'15:00', e:'15:20', en:'Gelato at Vivoli', zh:'冰淇淋 · Vivoli', ne:'Florence\'s most famous gelateria, since 1929. Traditional flavours, served in cups only.', nz:'1929 年开业，佛罗伦萨最有名的冰淇淋店。传统口味，只有杯装。', q:'Vivoli, Firenze' },

// ---------------- APP ----------------
let lang = 'en';
let idx = 0;

const $ = s => document.querySelector(s);
const route = $('#route'), strip = $('#strip'), view = $('#dayView');
const DOW_EN = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const DOW_ZH = ['周日','周一','周二','周三','周四','周五','周六'];
const MON_EN = ['January','February','March','April','May','June','July','August','September','October','November','December'];

function mapUrl(q){ return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(q); }
function dateObj(d){ const [y,m,dd]=d.split('-').map(Number); return new Date(y,m-1,dd); }
function todayIdx(){
  const now = new Date(); const t = now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0');
  return DAYS.findIndex(x=>x.d===t);
}
function applyStatic(){
  document.querySelectorAll('[data-en]').forEach(el=>{ el.textContent = el.dataset[lang]; });
  document.querySelectorAll('.lang button').forEach(b=>b.classList.toggle('on', b.dataset.lang===lang));
  document.body.classList.toggle('zh', lang==='zh');
  document.documentElement.lang = lang==='zh' ? 'zh-CN' : 'en';
}
function renderRoute(){
  route.innerHTML = '';
  const cur = DAYS[idx].city;
  Object.entries(CITIES).forEach(([k,c])=>{
    const b = document.createElement('button'); b.type='button';
    b.className = k===cur ? 'on' : '';
    b.innerHTML = `<span class="dot"></span><span class="city serif">${lang==='zh'?c.zh:c.en}</span><span class="when">${lang==='zh'?c.when_zh:c.when_en}</span>`;
    b.addEventListener('click', ()=>{ idx = DAYS.findIndex(d=>d.city===k); render(); });
    route.appendChild(b);
  });
}
function renderStrip(){
  strip.innerHTML = '';
  const tI = todayIdx();
  DAYS.forEach((day,i)=>{
    const dt = dateObj(day.d);
    const b = document.createElement('button'); b.type='button'; b.setAttribute('role','tab');
    b.className = (i===idx?'on ':'') + (i===tI?'today':'');
    b.innerHTML = `<span class="dow">${lang==='zh'?DOW_ZH[dt.getDay()]:DOW_EN[dt.getDay()]}</span><span class="num serif">${dt.getDate()}</span>`;
    b.addEventListener('click', ()=>{ idx=i; render(); });
    strip.appendChild(b);
  });
  const on = strip.querySelector('.on');
  if(on && typeof on.scrollIntoView === 'function'){
    try { on.scrollIntoView({inline:'center', block:'nearest', behavior:'smooth'}); } catch(err){ /* ignore */ }
  }
}
function renderDay(){
  const day = DAYS[idx]; const c = CITIES[day.city]; const dt = dateObj(day.d);
  const dateLine = lang==='zh'
    ? `${dt.getMonth()+1}月${dt.getDate()}日 ${DOW_ZH[dt.getDay()]}`
    : `${DOW_EN[dt.getDay()]} ${dt.getDate()} ${MON_EN[dt.getMonth()]}`;
  const evs = day.ev.map((e,ei)=>{
    const tr = lang==='zh' ? e.tr_zh : e.tr_en;
    const note = lang==='zh' ? e.nz : e.ne;
    const tip = lang==='zh' ? e.tip_zh : e.tip_en;
    const hasMeta = e.q || tip;
    return `${tr?`<li class="hop">${tr}</li>`:''}
    <li class="ev ${e.travel?'travel':''} ${e.ticket?'ticket':''}">
      <div class="time">${e.notime?'':e.t}${(e.notime||!e.e)?'':`<span class="end">${e.e}</span>`}</div>
      <div>
        <div class="name">${lang==='zh'?e.zh:e.en}</div>
        ${note?`<div class="note">${note}</div>`:''}
        ${hasMeta?`<div class="meta">
          ${e.q?`<a class="actionbtn" href="${mapUrl(e.q)}" target="_blank" rel="noopener">${lang==='zh'?'打开地图':'Open in Maps'}</a>`:''}
          ${tip?`<button type="button" class="actionbtn tip" data-idx="${ei}">${lang==='zh'?'注意事项':'Things to note'}</button>`:''}
        </div>`:''}
      </div>
    </li>`;}).join('');
  const backText = lang==='zh' ? day.back_zh : day.back_en;
  const backHtml = backText ? `<li class="hop back">${backText}</li>` : '';
  view.innerHTML = `
    <div class="day-head">
      <h2 class="serif">${dateLine}, ${lang==='zh'?c.zh:c.en}</h2>
      <p class="where">
        <a href="${mapUrl(c.hotelq)}" target="_blank" rel="noopener">${c.hotel}</a></p>
    </div>
    <ul class="events">${evs}${backHtml}</ul>`;
  $('#prev').disabled = idx===0;
  $('#next').disabled = idx===DAYS.length-1;

  document.querySelectorAll('.actionbtn.tip').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const e = DAYS[idx].ev[Number(btn.dataset.idx)];
      const title = lang==='zh' ? e.zh : e.en;
      const tip = lang==='zh' ? e.tip_zh : e.tip_en;
      openSheet(title, tip);
    });
  });
}

function openSheet(title, body){
  $('#sheetTitle').textContent = title;
  $('#sheetBody').textContent = body;
  $('#sheet').classList.add('open');
  $('#sheetBackdrop').classList.add('open');
}
function closeSheet(){
  $('#sheet').classList.remove('open');
  $('#sheetBackdrop').classList.remove('open');
}
function render(){ applyStatic(); renderRoute(); renderStrip(); renderDay(); try{ window.scrollTo({top: Math.min(window.scrollY, 0), behavior:'auto'}); }catch(err){} }

document.querySelectorAll('.lang button').forEach(b=>b.addEventListener('click', ()=>{ lang=b.dataset.lang; render(); }));
$('#sheetClose').addEventListener('click', closeSheet);
$('#sheetBackdrop').addEventListener('click', closeSheet);
$('#prev').addEventListener('click', ()=>{ if(idx>0){ idx--; render(); } });
$('#next').addEventListener('click', ()=>{ if(idx<DAYS.length-1){ idx++; render(); } });

// start on today if inside the trip, else day one
const t = todayIdx(); idx = t>=0 ? t : 0;
render();
</script>
</body>
</html>
